{% extends 'base.html' %}

{% block title %}Page not found | MUTITECH{% endblock %}

{% block content %}
  <section id="error-page">
    <p class="error-code">404</p>
    <h1>We can't find that page</h1>
    <p class="error-text">The address may be mistyped, or the page may have moved.</p>
    <div class="error-actions">
      <a href="{% url 'home' %}">Back to home</a>
      <a href="{% url 'contact' %}">Contact us</a>
    </div>
  </section>
{% endblock %}
